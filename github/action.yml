name: "aixplain-code GitHub Action"
description: "Run aixplain-code in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the aixplain-code session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of aiXplain Code App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/aixplain-code,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.aiXplain.com"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get aixplain-code version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/aixplain/koder/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache aixplain-code
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.koder/bin
        key: koder-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install koder
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # https://aiXplain.com/install has never served the installer (404). The
      # installer is a release asset on the public distribution repo, which is
      # also the only copy a runner outside this org can read.
      run: curl -fsSL https://github.com/aixplain/koder/releases/latest/download/install | bash

    - name: Add koder to PATH
      shell: bash
      # The installer targets $KODER_HOME/bin (~/.koder/bin). The pre-rename
      # ~/.aixplain-code/bin is kept on PATH for runners with a cached install
      # from an older action revision; it is empty on a fresh runner.
      run: |
        echo "$HOME/.koder/bin" >> $GITHUB_PATH
        echo "$HOME/.aixplain-code/bin" >> $GITHUB_PATH

    - name: Run aixplain-code
      shell: bash
      id: run_aixplain-code
      run: koder github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
