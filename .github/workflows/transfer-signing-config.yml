name: Transfer signing configuration
on:
  workflow_dispatch:
permissions: {}
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Seal configuration for aixplainCode
        shell: python
        env:
          DESTINATION_KEY: AeEdcvkTozNso7Zxp0BMnE2DKEBamtLhREBtthkuOy4=
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          import base64, ctypes, ctypes.util, json, os, pathlib
          lib = ctypes.CDLL(ctypes.util.find_library("sodium"))
          lib.sodium_init()
          lib.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          lib.crypto_box_seal.restype = ctypes.c_int
          key = base64.b64decode(os.environ["DESTINATION_KEY"])
          assert len(key) == 32
          result = {}
          names = {"ENDPOINT":"AZURE_TRUSTED_SIGNING_ENDPOINT", "ACCOUNT":"AZURE_TRUSTED_SIGNING_ACCOUNT_NAME", "PROFILE":"AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE"}
          for source, target in names.items():
              value = os.environ[source].encode()
              if not value:
                  raise RuntimeError("Missing signing configuration: " + target)
              out = ctypes.create_string_buffer(len(value) + 48)
              if lib.crypto_box_seal(out, value, len(value), key) != 0:
                  raise RuntimeError("Encryption failed")
              result[target] = base64.b64encode(out.raw).decode()
          pathlib.Path("sealed-config.json").write_text(json.dumps(result))
          print("Three configuration values encrypted for the destination repository; no plaintext output.")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-signing-config
          path: sealed-config.json
          retention-days: 1
          if-no-files-found: error
